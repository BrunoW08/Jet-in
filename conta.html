<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet-in — Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/conta.css">
</head>
<body>
  <main class="aplicativo">

    <header class="cabecalho-pagina">
      <a class="botao-voltar" href="index.html">
        <img src="imagens/voltar.svg" alt="Voltar">
      </a>
      <span class="titulo-pagina-conta">Conta</span>
    </header>

    <section class="boasvindas-conta">
      <h1>Bem-vindo,<br><span>Helder Palharini de Mattos</span></h1>
    </section>

    <section class="cartao-perfil">
      <div class="perfil-cabecalho">
        <div>
          <div class="nome-perfil">Helder Palharini de Mattos</div>
          <div class="detalhe-perfil">Desde fevereiro de 2026 - 4 voos</div>
        </div>
        <div class="avatar-perfil">HP</div>
      </div>

      <div class="estatisticas-perfil">
        <div class="estatistica">
          <strong>4</strong>
          <span>Voos</span>
        </div>
        <div class="estatistica">
          <strong>5h30min</strong>
          <span>Horas</span>
        </div>
        <div class="estatistica">
          <strong>R$ 77K</strong>
          <span>Gastos</span>
        </div>
      </div>
    </section>

    <section class="lista-conta">
      <button class="item-conta">
        <div class="icone-item">
          <img src="imagens/conta.svg" alt="">
        </div>
        <div class="texto-item">
          <strong>Dados da conta</strong>
          <span>Verifique e atualize seus dados</span>
        </div>
        <span class="seta-item">›</span>
      </button>

      <button class="item-conta">
        <div class="icone-item">
          <img src="imagens/cartao.svg" alt="">
        </div>
        <div class="texto-item">
          <strong>Meios de pagamento</strong>
          <span>veja ou adicione seus meios de pagamento</span>
        </div>
        <span class="seta-item">›</span>
      </button>

      <button class="item-conta">
        <div class="icone-item">
          <img src="imagens/predio.svg" alt="">
        </div>
        <div class="texto-item">
          <strong>Ligue a uma empresa</strong>
          <span>cadastre sua empresa ou se lige a uma</span>
        </div>
        <span class="seta-item">›</span>
      </button>

      <div class="item-conta item-info">
        <div class="icone-item">
          <img src="imagens/headphone.svg" alt="">
        </div>
        <div class="texto-item">
          <strong>Concierge 24h</strong>
          <span>+55 51 9145 2719</span>
        </div>
      </div>
    </section>

    <button class="botao-sair">Sair da conta</button>

    <nav class="navegacao-inferior">
      <a href="index.html">
        <img class="icone" src="imagens/home.svg" alt="">
        início
      </a>
      <a href="reserva.html">
        <img class="icone" src="imagens/reserva.svg" alt="">
        Reservar
      </a>
      <a href="frota.html">
        <img class="icone" src="imagens/aviao.svg" alt="">
        Frota
      </a>
      <a href="voos.html">
        <img class="icone" src="imagens/voos.svg" alt="">
        Voos
      </a>
      <a class="ativo" href="conta.html">
        <img class="icone" src="imagens/conta.svg" alt="">
        Conta
      </a>
    </nav>

  </main>
</body>
</html>
